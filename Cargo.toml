[workspace]
members = [
    "crates/backend-c",
    "crates/backend-go",
    "crates/backend-cpp",
    "crates/backend-java",
    "crates/backend-python",
    "crates/backend-rust",
    "crates/backend-typescript",
    "crates/benchmark",
    "crates/build",
    "crates/check",
    "crates/cli",
    "crates/codegen",
    "crates/conformance",
    "crates/core-ir",
    "crates/diagnostics",
    "crates/eval",
    "crates/ir",
    "examples/models-and-validation",
    "examples/real-world/escape-string-regexp",
    "examples/real-world/html-escaper",
    "examples/real-world/has-flag",
    "examples/real-world/is-fullwidth-code-point",
    "examples/real-world/normalize-newline",
    "examples/real-world/parse-ms",
    "examples/real-world/slash",
    "examples/real-world/split-on-first",
    "examples/real-world/stdlib-is-negative-zero",
    "examples/real-world/strip-bom",
    "examples/real-world/trim-newlines",
    "examples/real-world/truncate-utf8-bytes",
    "examples/registration",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
repository = "https://github.com/Alice-Williams/polyrust"
publish = false

[workspace.dependencies]
portable_backend_c = { package = "polyrust-backend-c", path = "crates/backend-c" }
portable_backend_go = { package = "polyrust-backend-go", path = "crates/backend-go" }
portable_backend_cpp = { package = "polyrust-backend-cpp", path = "crates/backend-cpp" }
portable_backend_java = { package = "polyrust-backend-java", path = "crates/backend-java" }
portable_backend_python = { package = "polyrust-backend-python", path = "crates/backend-python" }
portable_backend_rust = { package = "polyrust-backend-rust", path = "crates/backend-rust" }
portable_backend_typescript = { package = "polyrust-backend-typescript", path = "crates/backend-typescript" }
portable_build = { package = "polyrust-build", path = "crates/build" }
portable_check = { package = "polyrust-check", path = "crates/check" }
portable_codegen = { package = "polyrust-codegen", path = "crates/codegen" }
portable_conformance = { package = "polyrust-conformance", path = "crates/conformance" }
portable_core_ir = { package = "polyrust-core-ir", path = "crates/core-ir" }
portable_diagnostics = { package = "polyrust-diagnostics", path = "crates/diagnostics" }
portable_eval = { package = "polyrust-eval", path = "crates/eval" }
portable_ir = { package = "polyrust-ir", path = "crates/ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
