name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BAZELISK_HOME: /var/tmp/polyrust-cache/bazelisk
  POLYRUST_CI_BIN: /var/tmp/polyrust-cache/bin

jobs:
  windows-contract:
    name: Windows host/container contract
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Validate pinned Linux development contract from Windows
        shell: pwsh
        run: ./tools/release/windows_contract.ps1

  fast:
    name: Fast PR checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Install pinned Bazelisk
        run: bash tools/ci/install_bazelisk.sh
      - name: Rust and Bazel linters
        run: bazelisk --batch test //:rustfmt_test //:rust_clippy_test //:buildifier_test //tools/dependency-boundaries:dependency_boundaries_test

  rust-compatibility:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.98.0", stable]
    steps:
      - uses: actions/checkout@v7
      - name: Install selected Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - name: Test workspace with selected Rust
        run: cargo +"${{ matrix.toolchain }}" test --workspace --all-features

  deterministic-manifests:
    name: Determinism on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Bazelisk
        run: bash tools/ci/install_bazelisk.sh
      - name: Generate normalized manifests from a clean directory
        run: |
          rm -rf ci-manifest
          mkdir ci-manifest
          bazelisk --batch run //examples/models-and-validation:generate -- "$PWD/ci-manifest"
      - uses: actions/upload-artifact@v7
        with:
          name: manifests-${{ matrix.os }}
          path: ci-manifest
          if-no-files-found: error

  compare-manifests:
    name: Cross-host manifest comparison
    needs: deterministic-manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: manifests-ubuntu-22.04
          path: first
      - uses: actions/download-artifact@v8
        with:
          name: manifests-ubuntu-24.04
          path: second
      - name: Require byte-identical trees
        run: diff -ru first second

  release-gate:
    name: Cached release gate
    needs: [windows-contract, fast, rust-compatibility, compare-manifests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Restore persistent non-semantic caches
        id: restore-non-semantic-caches
        uses: actions/cache/restore@v6
        with:
          path: |
            /var/tmp/polyrust-cache/bin
            /var/tmp/polyrust-cache/bazelisk
            /var/tmp/polyrust-cache/bazel-repository
            /var/tmp/polyrust-cache/bazel-disk
            ${{ runner.temp }}/polyrust-cache/cargo-home
            ${{ runner.temp }}/polyrust-cache/cargo-tools
            ${{ runner.temp }}/polyrust-cache/node-tools
            ${{ runner.temp }}/polyrust-cache/python-tools
          key: polyrust-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', '.bazelrc', 'tools/ci/install_bazelisk.sh', 'tools/ci/install_release_tools.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            polyrust-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', '.bazelrc', 'tools/ci/install_bazelisk.sh', 'tools/ci/install_release_tools.sh') }}-
      - name: Report persistent cache restoration
        env:
          MATCHED_CACHE_KEY: ${{ steps.restore-non-semantic-caches.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_CACHE_KEY" ]]; then
            echo "Restored cache lineage: $MATCHED_CACHE_KEY"
          else
            echo "No compatible cache lineage was available"
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - name: Install pinned Bazelisk
        run: bash tools/ci/install_bazelisk.sh
      - name: Install pinned native release tools
        env:
          POLYRUST_CI_CACHE_ROOT: ${{ runner.temp }}/polyrust-cache
        run: bash tools/ci/install_release_tools.sh
      - name: Cached complete release gate
        run: bash tools/release/release_gate.sh
      - name: Prepare persistent cache archive
        run: |
          chmod -R u+rwX /var/tmp/polyrust-cache "$RUNNER_TEMP/polyrust-cache"
          test -z "$(find /var/tmp/polyrust-cache ! -readable -print -quit)"
          test -z "$(find "$RUNNER_TEMP/polyrust-cache" ! -readable -print -quit)"
      - name: Save refreshed persistent non-semantic caches
        if: ${{ success() }}
        uses: actions/cache/save@v6
        with:
          path: |
            /var/tmp/polyrust-cache/bin
            /var/tmp/polyrust-cache/bazelisk
            /var/tmp/polyrust-cache/bazel-repository
            /var/tmp/polyrust-cache/bazel-disk
            ${{ runner.temp }}/polyrust-cache/cargo-home
            ${{ runner.temp }}/polyrust-cache/cargo-tools
            ${{ runner.temp }}/polyrust-cache/node-tools
            ${{ runner.temp }}/polyrust-cache/python-tools
          key: polyrust-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', '.bazelrc', 'tools/ci/install_bazelisk.sh', 'tools/ci/install_release_tools.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
